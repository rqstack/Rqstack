
name: Generate snake animation

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Generate snake.svg
        uses: Platane/snk@v3
        with:
          github_user_name: rqstack
          # O caminho final (branch snake-output, arquivo snake.svg) é o mesmo usado no README
          outputs: dist/snake.svg?palette=github-dark&color_snake=#4493f8

      - name: Publish snake.svg
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: snake-output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
