```yaml
name: Atualizar README

on:
  schedule:
    - cron: "17 8 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  atualizar:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4

      - name: Atualizar data
        run: |
          echo "Última atualização automática: $(date -u '+%d/%m/%Y %H:%M UTC')" > .ultima-atualizacao

      - name: Salvar atualização
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .ultima-atualizacao
          git diff --cached --quiet || git commit -m "chore: atualização automática"
          git push
```
