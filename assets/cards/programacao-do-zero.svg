<text x="32" y="46" class="eyebrow">O PROBLEMA</text><text x="32" y="80" class="text">Durante meus estudos, senti falta de uma</text><text x="32" y="102" class="text">maneira mais prática e interativa de</text><text x="32" y="124" class="text">aprender programação.</text><line x1="420" y1="32" x2="420" y2="140" stroke="#21262d"/><circle cx="420" cy="86" r="14" fill="#0d1117" stroke="#30363d"/><svg x="411" y="77" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#4493f8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"/><path d="m12 5 7 7-7 7"/></svg><text x="452" y="46" class="eyebrow">A PROPOSTA</text><text x="452" y="80" class="text">Uma plataforma em que o aprendizado acontece</text><text x="452" y="102" class="text">na prática: trilhas organizadas, atividades</text><text x="452" y="124" class="text">interativas e desafios de programação.</text><line x1="32" y1="168" x2="808" y2="168" stroke="#21262d"/><text x="109.6" y="222" class="big" text-anchor="middle">20</text><text x="109.6" y="246" class="label" text-anchor="middle">trilhas</text><text x="264.79999999999995" y="222" class="big" text-anchor="middle">155</text><text x="264.79999999999995" y="246" class="label" text-anchor="middle">aulas</text><text x="420.0" y="222" class="big" text-anchor="middle">175</text><text x="420.0" y="246" class="label" text-anchor="middle">quizzes</text><text x="575.1999999999999" y="222" class="big" text-anchor="middle">9</text><text x="575.1999999999999" y="246" class="label" text-anchor="middle">jogos</text><text x="730.4" y="222" class="big" text-anchor="middle">11</text><text x="730.4" y="246" class="label" text-anchor="middle">linguagens nos desafios</text>
</svg>
